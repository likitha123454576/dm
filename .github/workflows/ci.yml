name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app.py

      - name: Build the container image
        run: docker build --tag production-packaging-demo:${{ github.sha }} .

      - name: Record build identity
        run: |
          echo "source_commit=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "image_tag=production-packaging-demo:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect production-packaging-demo:${GITHUB_SHA} --format='image_id={{.Id}}' >> "$GITHUB_STEP_SUMMARY"

